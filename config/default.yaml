project:
  name: "orca-trading"
  version: "0.1.0"
  author: "poyov"
  mode: "development"

data:
  exchange: "binance"
  symbols:
    - "BTC/USDT"
  timeframes:
    - "5m"
    - "15m"
    - "1h"
  storage:
    type: "sqlite"
    path: "data/market.db"
  limits:
    max_days_history: 90  # Commence petit
    update_frequency_minutes: 15

features:
  technical_indicators:
    - "sma_20"
    - "sma_50"
    - "rsi_14"
    - "bb_upper"
    - "bb_lower"
    - "volume_sma"

environment:
  initial_balance: 10000.0
  commission: 0.001  # 0.1%
  max_position_size: 0.1  # 10% du capital

training:
  episodes: 100
  validation_split: 0.2

logging:
  level: "INFO"
  file: "logs/orca.log"